[project]
name = "frappe_hr_self_service"
authors = [
    { name = "dntrply" }
]
description = "Lightweight employee and approver self-service for Frappe HR leave workflows."
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
hrms = ">=16.0.0,<17.0.0"

[project.urls]
Homepage = "https://github.com/dntrply/frappe_hr_self_service"
Repository = "https://github.com/dntrply/frappe_hr_self_service"
"Bug Reports" = "https://github.com/dntrply/frappe_hr_self_service/issues"
